[project]
name = "ttks-dps"
version = "0.3.0"
description = "Small Flask helpdesk: tickets, agent queue, in-app notifications."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
# docs/ holds the approved specs/plans; leave their embedded snippets untouched.
extend-exclude = ["docs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, comprehensions, simplify.
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
