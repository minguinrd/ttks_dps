services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ttks_data:/data
    restart: unless-stopped

volumes:
  ttks_data:
